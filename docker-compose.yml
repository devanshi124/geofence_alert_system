services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geofence_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: geofence_user
      POSTGRES_PASSWORD: geofence_pass
      POSTGRES_DB: geofence_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence_user -d geofence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geofence_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://geofence_user:geofence_pass@postgres:5432/geofence_db?sslmode=disable
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  postgres_data: